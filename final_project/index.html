<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller</title>
    <script src="dice.js" defer></script>
    <link href="dice.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">

</head>
<body>
    <div class="dice_section">
        <p class="dice">6</p>
    </div>
    <div class="results_section">
        <h1 class="result_box">6</h1>
    </div> 
    <div class="count_section">
        <p>One's : 0</p>
        <p>Two's : 0</p>
        <p>Three's : 0</p>
        <p>Four's : 0</p>
        <p>Five's : 0</p>
        <p>Six's : 0</p>
    </div>

    <div class="hand_section">
        <p>Hand</p>
    </div>


    <div class="button_section">
        <button class="reroll" type="button">Reroll</button>
        <button class="add_button" type="button">Add Dice</button>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trial</title>
    <script src="draft-dice.js" defer></script>
    <link href="draft.css" rel="stylesheet">
</head>
<body>
    <div id="ui-screens">
        <div id="screen-main-menu" class="screen">
            <h1>High Rollers</h1>
            <button class="dice-bag-button">Open Dice Bag</button>
            <button id="battle-button">Fight!</button>
            <button id="shop-button">Merchant</button>
        </div>
        <div id="screen-battle" class="screen hidden">
            <h1>Battle</h1>
            <div id="score-section"></div>
            <button class="dice-bag-button">Open Dice Bag</button>
            <button class="main-menu-button">Back</button>
        </div>
        <div id="screen-shop" class="screen hidden">
            <h1>Merchant</h1>
            <button class="dice-bag-button">Open Dice Bag</button>
            <button class="main-menu-button">Back</button>
        </div>
        <div id="dice-bag-modal" class="modal-display hidden">
            <div class="dice-modal bag-content">
                <button class="close-button">X</button>
                <h2>Dice Bag:</h2>
                <div id="modal-dice-list">
                </div>
            </div>
        </div>

</body>
</html>

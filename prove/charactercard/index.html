<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="A Site that Holds a Character Card">
    <meta property="og:url" content="https://wdd131/prove/charactercard/index.html">
    <meta property="og:image" content="https://yourURLofSocialPreviewImageHere.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card">
    <meta name="twitter:description" content="A Site that Holds a Character Card">
    <meta name="twitter:image" content="https://yourURLofSocialPreviewImageHere.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A site that host a character card.">
    <title>Character Card</title>
    <link href="charactercard.css" rel= "stylesheet">
    <script src="charactercard.js" defer></script>
</head>
<main>
<body>
    <div class="card">
        <img class="image" src="snortleblat.webp" alt="Swamp Beast Picture">
        <h1 class="name">Snortleblat</h1>
        <div class="stats">
            <p>Class: Swamp Beast Diplomat</p>
            <p class="level">Level: 5</p>
            <p class="health">Health: 100</p>
        </div>
        <div class="buttons">
            <button class= "attacked" type="button">Attacked</button>
            <button class= "level_up" type="button">Level Up</button>
        </div>
    </div>
</body>
</main>
</html>
